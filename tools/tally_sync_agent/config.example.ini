; Copy to config.ini and fill in. config.ini holds an API secret -- keep it on the
; Tally PC only, never commit it.

[erp]
; The DMS / ERPNext site, e.g. https://pacific-inc.storenxt.in (local: http://localhost:8000)
url = http://localhost:8000
; API key + secret of a user with the Accounts Manager role (User > API Access > Generate Keys)
api_key =
api_secret =

[tally]
; TallyPrime's XML port: F1 Help > Settings > Connectivity > "TallyPrime acts as" Server/Both, port 9000
url = http://localhost:9000
; Company name exactly as TallyPrime shows it, spaces included
company = Pacific Inc  -  (From 1-Apr-2025)
; ONLY for an unlicensed (Educational mode) TallyPrime used for testing, which accepts
; just the 1st/2nd/31st of a month: moves each voucher to the 1st. Never on the real Tally.
educational_mode = no

[agent]
interval_seconds = 60
batch_size = 20
